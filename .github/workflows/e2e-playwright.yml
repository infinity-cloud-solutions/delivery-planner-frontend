name: Playwright E2E Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REACT_APP_COGNITO_USER_POOL_ID: us-east-1_test
      REACT_APP_COGNITO_CLIENT_ID: test-client-id
      REACT_APP_COGNITO_ISS: https://cognito-idp.us-east-1.amazonaws.com/test
      REACT_APP_CLIENTS_BASE_URL: https://example.test/clients
      REACT_APP_PRODUCTS_BASE_URL: https://example.test/products
      REACT_APP_ORDERS_BASE_URL: https://example.test/orders
      REACT_APP_UPDATE_SEQUENCING_ORDERS_BASE_URL: https://example.test/orders/schedule
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test -- --watchAll=false

      - name: Install Playwright browsers and deps
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
